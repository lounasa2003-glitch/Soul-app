# TEMPORAL -- verificacion en vivo del bloque de edad minima (commit 33e0f37).
# Pensado para correrse una vez (o unas pocas veces, mientras se depura) y
# despues borrarse junto con scripts/verificacion-edad-minima-vivo.mjs.
#
# Solo se dispara a mano desde la pestaña Actions de GitHub (workflow_dispatch).
# No corre en push ni en ningun horario -- no hay claves "push:" ni "schedule:"
# en este archivo.
#
# El script (scripts/verificacion-edad-minima-vivo.mjs) primero hace un
# diagnostico comparativo (mismo access_token recien emitido, directo contra
# Supabase vs contra /api/guardar) y solo si ambos lo aceptan sigue con las
# 4 pruebas de edad minima, con acceso administrativo directo a Supabase para
# verificar residuos, y borra fisicamente todo lo que haya creado en su
# propio bloque finally (con manejo de SIGTERM/SIGINT por si este job la
# corta por timeout a mitad de camino).
name: Verificacion manual - edad minima (TEMPORAL)

on:
  workflow_dispatch: {}

# Permiso minimo: el job solo necesita poder leer el codigo del repo
# (actions/checkout). No escribe nada, no crea releases, no toca Issues/PRs,
# no necesita permisos de escritura en ningun lado.
permissions:
  contents: read

jobs:
  verificar-edad-minima:
    runs-on: ubuntu-latest
    # Techo duro de tiempo -- el script en si hace un puñado de llamadas HTTP
    # (deberia terminar en menos de un minuto); este timeout es una red de
    # seguridad para que el job nunca quede colgado consumiendo minutos de
    # Actions, no un tiempo esperado de ejecucion.
    timeout-minutes: 10
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Los cuatro valores sensibles/de configuracion viajan SOLO como
      # variables de entorno del proceso, resueltas por GitHub a partir de
      # los secrets del repositorio en el momento de ejecutar el step -- en
      # ningun lugar de este archivo YAML aparece un valor literal. GitHub
      # Actions ademas enmascara automaticamente en los logs cualquier texto
      # que coincida con un secret registrado, como red adicional adentro
      # del proceso mismo (que ya no imprime ninguna de las dos keys en
      # ningun punto, ver comentarios al principio del script).
      # SUPABASE_ANON_KEY se agrega para el diagnostico comparativo inicial:
      # el script llama /auth/v1/user directo contra Supabase con el mismo
      # access_token recien emitido, para distinguir un token invalido de
      # origen de un problema especifico del backend en Vercel.
      - name: Correr verificacion de edad minima (crea y borra cuentas descartables)
        env:
          SOUL_APP_URL: ${{ secrets.SOUL_APP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verificacion-edad-minima-vivo.mjs
