# TEMPORAL -- verificacion en vivo del fix del header Authorization
# (lib/authUtil.js + soul.html). Se borra junto con
# scripts/verificacion-fix-authorization.mjs en cuanto se confirme el
# resultado.
#
# Solo se dispara a mano desde la pestaña Actions de GitHub (workflow_dispatch).
# No corre en push ni en ningun horario.
name: Verificacion manual - fix Authorization (TEMPORAL)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verificar-fix-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Correr verificacion del fix (crea y borra cuentas descartables)
        env:
          SOUL_APP_URL: ${{ secrets.SOUL_APP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verificacion-fix-authorization.mjs
